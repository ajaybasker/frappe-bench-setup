[build-system]
requires = ["hatchling>=1.21,<2"]
build-backend = "hatchling.build"

[project]
name = "frappe-setup-cli"
version = "1.0.1"
description = "Guided, verified installer for Frappe Framework development environments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Frappe Setup CLI contributors" }]
keywords = ["frappe", "erpnext", "bench", "installer", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "PyYAML>=6.0,<7",
    "packaging>=23.2,<27",
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6,<7",
]

[project.scripts]
frappe-setup = "frappe_setup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frappe_setup"]

[tool.hatch.build.targets.wheel.force-include]
"config/version-matrix.yaml" = "frappe_setup/data/version-matrix.yaml"
"config/app-catalog.yaml" = "frappe_setup/data/app-catalog.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end tests that need Docker and network (opt-in: FRAPPE_SETUP_INTEGRATION=1)",
    "network: tests that contact real upstream git repositories (opt-in: FRAPPE_SETUP_NETWORK_TESTS=1)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S603",  # subprocess without shell: all calls use argv lists by design
    "S607",  # partial executable paths: tools are resolved from PATH deliberately
    "SIM102",  # nested ifs are kept where they read better
    "S101",  # asserts are used for type narrowing of internal invariants only
    "RUF001", "RUF003",  # box-drawing characters in UI strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/frappe_setup"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
